name: Bug report
description: Report a reproducible problem with Tabby TFTP
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include Tabby, tabby-tftp, and operating-system versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or reproduction steps
